[project]
name = "conductor-cli"
version = "0.1.0"
description = "Control plane for managing Arize AX as config-as-code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.scripts]
conductor = "conductor.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conductor"]
